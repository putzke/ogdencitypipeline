name: Update Pineview Camera

on:
  schedule:
    # Every 30 minutes. Offset from :00/:30 on purpose -- GitHub's docs warn
    # that scheduled runs queued exactly on the hour/half-hour are more
    # likely to be delayed under high platform load, and on 2026-09-26 this
    # workflow actually went ~4.5 hours without firing at */30. Running at
    # :04/:34 instead avoids the busiest queue moments. Even so, scheduled
    # runs are best-effort and can lag -- this is not a real-time feed.
    - cron: '4,34 * * * *'
  workflow_dispatch:  # Allow manual trigger
  # EMERGENCY HOLD: editing camera_hold.json (hold true/false) runs this
  # workflow right away instead of waiting for the next 30-minute slot, so
  # the public photo/video come down (or go back up) within a couple of
  # minutes. Only that one file triggers it, so the bot's own commits of
  # camera media never re-trigger this workflow.
  push:
    paths:
      - 'camera_hold.json'

concurrency:
  group: pineview-camera-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Push with a real PAT instead of the default GITHUB_TOKEN.
          # GitHub does not let commits pushed with the default token
          # trigger other workflows (anti-recursion protection), which
          # meant the "Deploy to Pages" workflows never ran after this
          # bot's commits and the live site stayed frozen on whatever a
          # human last pushed. A PAT-authored push is treated as a normal
          # push and triggers the deploy workflows as expected.
          token: ${{ secrets.PAGES_DEPLOY_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyspypoint Pillow

      # ffmpeg builds the H.264 MP4 timelapse. Install only if the runner
      # image doesn't already ship it.
      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      # The rolling frame buffer used to build the timelapse MP4 is kept in
      # Actions cache, NOT committed to git — otherwise every individual
      # frame captured every 30 minutes would live forever in git history.
      - name: Restore camera frame buffer cache
        uses: actions/cache/restore@v4
        with:
          path: cam_frame_buffer
          key: spypoint-frame-buffer-${{ github.run_id }}
          restore-keys: |
            spypoint-frame-buffer-

      - name: Fetch latest camera photo and rebuild timelapse
        env:
          SPYPOINT_USERNAME: ${{ secrets.SPYPOINT_USERNAME }}
          SPYPOINT_PASSWORD: ${{ secrets.SPYPOINT_PASSWORD }}
        run: python scrape_spypoint.py

      - name: Save camera frame buffer cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cam_frame_buffer
          key: spypoint-frame-buffer-${{ github.run_id }}

      - name: Commit and push if changed
        run: |
          git config user.name "Pineview Camera Bot"
          git config user.email "bot@ogdencitypipeline.com"
          # Stage each file if it exists this run OR is already tracked (so a
          # deletion -- e.g. the photo/video coming down during an emergency
          # hold, or the retired GIF -- gets committed too). "git add" with
          # multiple pathspecs aborts entirely (exit 128) if any single one
          # matches nothing, hence the per-file checks.
          for f in images/pineview-cam-latest.jpg images/pineview-cam-timelapse.mp4 images/pineview-cam-timelapse.gif pineview_cam.json pineview_cam_hd.json pineview_cam_daily_archive.json pineview_cam_power_log.jsonl pineview_cam_excluded.json; do
            if [ -e "$f" ] || git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              git add -A -- "$f"
            fi
          done
          # Full-HD gallery images and the daily-archive photos each live in
          # their own directory and grow over time, so add whatever's there
          # (if anything) rather than listing individual filenames.
          if [ -d images/hd ] && [ -n "$(ls -A images/hd 2>/dev/null)" ]; then
            git add images/hd
          fi
          if [ -d images/daily-archive ] && [ -n "$(ls -A images/daily-archive 2>/dev/null)" ]; then
            git add images/daily-archive
          fi
          git diff --cached --quiet || git commit -m "Auto-update Pineview camera $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
