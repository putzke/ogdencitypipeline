name: Update Pineview Camera

on:
  schedule:
    # Every 30 minutes. Offset from :00/:30 on purpose -- GitHub's docs warn
    # that scheduled runs queued exactly on the hour/half-hour are more
    # likely to be delayed under high platform load, and on 2026-09-26 this
    # workflow actually went ~4.5 hours without firing at */30. Running at
    # :04/:34 instead avoids the busiest queue moments. Even so, scheduled
    # runs are best-effort and can lag -- this is not a real-time feed.
    - cron: '4,34 * * * *'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: pineview-camera-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyspypoint Pillow

      # The rolling frame buffer used to build the timelapse GIF is kept in
      # Actions cache, NOT committed to git — otherwise every individual
      # frame captured every 30 minutes would live forever in git history.
      - name: Restore camera frame buffer cache
        uses: actions/cache/restore@v4
        with:
          path: cam_frame_buffer
          key: spypoint-frame-buffer-${{ github.run_id }}
          restore-keys: |
            spypoint-frame-buffer-

      - name: Fetch latest camera photo and rebuild timelapse
        env:
          SPYPOINT_USERNAME: ${{ secrets.SPYPOINT_USERNAME }}
          SPYPOINT_PASSWORD: ${{ secrets.SPYPOINT_PASSWORD }}
        run: python scrape_spypoint.py

      - name: Save camera frame buffer cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cam_frame_buffer
          key: spypoint-frame-buffer-${{ github.run_id }}

      - name: Commit and push if changed
        run: |
          git config user.name "Pineview Camera Bot"
          git config user.email "bot@ogdencitypipeline.com"
          # Add each file only if it exists this run — the timelapse GIF in
          # particular doesn't exist until a second frame has been captured,
          # and "git add" with multiple pathspecs aborts entirely (exit 128)
          # if any single one doesn't match anything.
          for f in images/pineview-cam-latest.jpg images/pineview-cam-timelapse.gif pineview_cam.json pineview_cam_hd.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          # Full-HD gallery images live in their own directory and grow over
          # time as new photos are requested, so add whatever's there (if
          # anything) rather than listing individual filenames.
          if [ -d images/hd ] && [ -n "$(ls -A images/hd 2>/dev/null)" ]; then
            git add images/hd
          fi
          git diff --cached --quiet || git commit -m "Auto-update Pineview camera $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
